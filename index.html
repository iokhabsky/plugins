<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="scss/main.css">

        <!-- SVG favicon -->
        <link rel="icon" type="image/svg+xml" href="./img/favicon/favicon.svg">
        <!-- PNG favicon -->
        <link rel="icon" type="image/png" sizes="32x32"
            href="./img/favicon/favicon-32.png">
        <!-- ICO favicon -->
        <link rel="icon" href="./img/favicon/favicon.ico" type="image/x-icon">
        <!-- Apple devices -->
        <link rel="apple-touch-icon" sizes="180x180"
            href="./img/favicon/apple-touch-icon.png">
        <title>Slider</title>
    </head>

    <body>

        <div class="slider" data-mode="horizontal">
            <div class="slides">
                <div class="slide active">
                    <div class="slide-text">
                        <h2 class="slide-title">
                            Slide title on your website 1
                        </h2>
                        <h3 class="slide-subtitle">
                            Slide text under the title for your Website
                        </h3>
                        <a href="#" class="slide-link">
                            Read More
                        </a>
                    </div>
                    <img src="img/slide1.jpg" alt="slide image 1">
                </div>
                <div class="slide">
                    <div class="slide-text">
                        <h2 class="slide-title">
                            Slide title on your website 2
                        </h2>
                        <h3 class="slide-subtitle">
                            Slide text under the title for your Website
                        </h3>
                        <a href="#" class="slide-link">
                            Read More
                        </a>
                    </div>
                    <img src="img/slide2.jpg" alt="slide image 2">
                </div>
                <div class="slide">
                    <div class="slide-text">
                        <h2 class="slide-title">
                            Slide title on your website 3
                        </h2>
                        <h3 class="slide-subtitle">
                            Slide text under the title for your Website
                        </h3>
                        <a href="#" class="slide-link">
                            Read More
                        </a>
                    </div>
                    <img src="img/slide3.jpg" alt="slide image 3">
                </div>
            </div>
            <div class="slider-nav">
                <div class="prev-slide slide-arrow disabled">

                </div>
                <div class="next-slide slide-arrow">

                </div>
            </div>
        </div>

        <script src="js/common.js"></script>
    </body>

</html>
